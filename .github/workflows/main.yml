name: Vile Video Pipeline

on:
  workflow_dispatch:

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
      
      - name: Create package.json if missing
        run: |
          if [ ! -f package.json ]; then
            echo '{"name":"vile-base","version":"1.0.0","dependencies":{"@remotion/bundler":"^4.0.0","@remotion/renderer":"^4.0.0","@supabase/supabase-js":"^2.39.0","groq-sdk":"^0.3.0","react":"^18.2.0","react-dom":"^18.2.0","remotion":"^4.0.0"},"devDependencies":{"@types/react":"^18.2.0","@types/node":"^20.0.0","typescript":"^5.0.0"}}' > package.json
          fi
      
      - run: npm install --no-audit --no-fund
      - run: mkdir -p output

      - name: Generate script with Groq API
        run: node scripts/generate-script.js
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Create voiceover with Edge-TTS
        run: node scripts/generate-voiceover.js --input output/script.txt --output output/voiceover.mp3

      - name: Render video (local, using Remotion)
        run: node scripts/render-video.js

      - name: Verify video exists
        run: test -f output/final-video.mp4 || exit 1

      - name: Upload to Supabase Storage
        run: node scripts/upload-to-supabase.js --file output/final-video.mp4
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Cleanup
        if: always()
        run: rm -rf output/*.mp3 output/*.txt

      - name: Notify failure
        if: failure()
        run: echo "::error::Workflow failed"
